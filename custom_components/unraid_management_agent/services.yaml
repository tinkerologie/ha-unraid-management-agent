# Services for Unraid Management Agent integration

# Docker Container Services
container_start:
  name: Start Container
  description: Start a Docker container
  fields:
    config_entry_id: &configured_server
      name: Unraid server
      description: The configured Unraid server to control
      required: false
      selector:
        config_entry:
          integration: unraid_management_agent
    container_id:
      name: Container ID
      description: The ID or name of the container to start
      required: true
      example: "nginx"
      selector:
        text:

container_stop:
  name: Stop Container
  description: Stop a Docker container
  fields:
    config_entry_id: *configured_server
    container_id:
      name: Container ID
      description: The ID or name of the container to stop
      required: true
      example: "nginx"
      selector:
        text:

container_restart:
  name: Restart Container
  description: Restart a Docker container
  fields:
    config_entry_id: *configured_server
    container_id:
      name: Container ID
      description: The ID or name of the container to restart
      required: true
      example: "nginx"
      selector:
        text:

container_pause:
  name: Pause Container
  description: Pause a running Docker container
  fields:
    config_entry_id: *configured_server
    container_id:
      name: Container ID
      description: The ID or name of the container to pause
      required: true
      example: "nginx"
      selector:
        text:

container_resume:
  name: Resume Container
  description: Resume a paused Docker container (unpause)
  fields:
    config_entry_id: *configured_server
    container_id:
      name: Container ID
      description: The ID or name of the container to resume
      required: true
      example: "nginx"
      selector:
        text:

container_remove:
  name: Remove Container
  description: Remove a Docker container
  fields:
    config_entry_id: *configured_server
    container_id:
      name: Container ID
      description: The ID or name of the container to remove
      required: true
      example: "nginx"
      selector:
        text:
    remove_image:
      name: Remove Image
      description: Also remove the container image
      required: false
      example: false
      selector:
        boolean:

container_set_autostart:
  name: Set Container Autostart
  description: Enable or disable autostart for a Docker container
  fields:
    config_entry_id: *configured_server
    container_id:
      name: Container ID
      description: The ID or name of the container to configure
      required: true
      example: "nginx"
      selector:
        text:
    enabled:
      name: Enabled
      description: Whether container autostart should be enabled
      required: true
      example: true
      selector:
        boolean:

# Virtual Machine Services
vm_start:
  name: Start VM
  description: Start a virtual machine
  fields:
    config_entry_id: *configured_server
    vm_id:
      name: VM ID
      description: The ID or name of the VM to start
      required: true
      example: "Ubuntu"
      selector:
        text:

vm_stop:
  name: Stop VM
  description: Stop a virtual machine (graceful shutdown)
  fields:
    config_entry_id: *configured_server
    vm_id:
      name: VM ID
      description: The ID or name of the VM to stop
      required: true
      example: "Ubuntu"
      selector:
        text:

vm_restart:
  name: Restart VM
  description: Restart a virtual machine
  fields:
    config_entry_id: *configured_server
    vm_id:
      name: VM ID
      description: The ID or name of the VM to restart
      required: true
      example: "Ubuntu"
      selector:
        text:

vm_pause:
  name: Pause VM
  description: Pause a running virtual machine (suspend to RAM)
  fields:
    config_entry_id: *configured_server
    vm_id:
      name: VM ID
      description: The ID or name of the VM to pause
      required: true
      example: "Ubuntu"
      selector:
        text:

vm_resume:
  name: Resume VM
  description: Resume a paused virtual machine
  fields:
    config_entry_id: *configured_server
    vm_id:
      name: VM ID
      description: The ID or name of the VM to resume
      required: true
      example: "Ubuntu"
      selector:
        text:

vm_hibernate:
  name: Hibernate VM
  description: Hibernate a virtual machine (suspend to disk)
  fields:
    config_entry_id: *configured_server
    vm_id:
      name: VM ID
      description: The ID or name of the VM to hibernate
      required: true
      example: "Ubuntu"
      selector:
        text:

vm_force_stop:
  name: Force Stop VM
  description: Force stop a virtual machine (equivalent to power off)
  fields:
    config_entry_id: *configured_server
    vm_id:
      name: VM ID
      description: The ID or name of the VM to force stop
      required: true
      example: "Ubuntu"
      selector:
        text:

vm_reset:
  name: Reset VM
  description: Force reset a virtual machine
  fields:
    config_entry_id: *configured_server
    vm_id:
      name: VM ID
      description: The ID or name of the VM to reset
      required: true
      example: "Ubuntu"
      selector:
        text:

# Array Control Services
array_start:
  name: Start Array
  description: Start the Unraid array
  fields:
    config_entry_id: *configured_server

array_stop:
  name: Stop Array
  description: Stop the Unraid array
  fields:
    config_entry_id: *configured_server

array_clear_disk_stats:
  name: Clear Array Disk Stats
  description: Clear array disk read/write statistics
  fields:
    config_entry_id: *configured_server

# Parity Check Services
parity_check_start:
  name: Start Parity Check
  description: Start a parity check
  fields:
    config_entry_id: *configured_server

parity_check_stop:
  name: Stop Parity Check
  description: Stop the running parity check
  fields:
    config_entry_id: *configured_server

parity_check_pause:
  name: Pause Parity Check
  description: Pause the running parity check
  fields:
    config_entry_id: *configured_server

parity_check_resume:
  name: Resume Parity Check
  description: Resume a paused parity check
  fields:
    config_entry_id: *configured_server
