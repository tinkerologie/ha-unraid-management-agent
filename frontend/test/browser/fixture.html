<!doctype html>

    <style>
      * {
        box-sizing: border-box;
      }
      :root {
        --card-background-color: #1c1c24;
        --primary-background-color: #111116;
        --secondary-background-color: #282833;
        --primary-color: #f25f22;
        --primary-text-color: #e0e0e0;
        --secondary-text-color: #9e9e9e;
        --divider-color: rgba(255, 255, 255, 0.12);
        --ha-card-background: var(--card-background-color);
        --ha-card-border-radius: 12px;
        --ha-card-border-color: rgba(255, 255, 255, 0.1);
      }
      body {
        margin: 0;
        padding: 24px;
        background: #111116;
        color: #e0e0e0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .fixture-container {
        display: flex;
        flex-direction: column;
        gap: 20px;
        max-width: 900px;
        margin: 0 auto;
      }
      ha-card {
        background: var(--ha-card-background);
        border: 1px solid var(--ha-card-border-color);
        border-radius: var(--ha-card-border-radius);
        padding: 16px;
        display: block;
      }
    </style>
  </head>

        entity_id: "button.cube_container_restart_plex", state: "unknown", attributes: {},

        mockHass.entities[entity_id] = { entity_id, device_id: "dev_1", platform: "unraid_management_agent" };

      window.mockHass = mockHass;

      const container = document.getElementById("container");
      const cardTags = [
        "unraid-management-agent-server-card",
        "unraid-management-agent-storage-card",
        "unraid-management-agent-shares-card",
        "unraid-management-agent-docker-card",
        "unraid-management-agent-ups-card",

        "unraid-management-agent-network-card",

        "unraid-management-agent-maintenance-card",
        "unraid-management-agent-remote-shares-card",
        "unraid-management-agent-unassigned-devices-card",
        "unraid-management-agent-dashboard-card",
      ];

      for (const tag of cardTags) {
        const el = document.createElement(tag);
        el.id = tag.replace("unraid-management-agent-", "");
        el.setConfig({ type: `custom:${tag}` });
        el.hass = mockHass;
        container.appendChild(el);
      }

      await Promise.all(
        Array.from(container.children).map((c) => c.updateComplete)
      );

      // Signal ready
      window.fixtureReady = true;

</html>
