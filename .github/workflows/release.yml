# yamllint disable rule:line-length
name: Release

on:
  push:
    branches: [main]
    paths: [custom_components/unraid_management_agent/manifest.json]
    tags: [v*]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build and attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      publish: ${{ steps.release.outputs.publish }}
      create_tag: ${{ steps.release.outputs.create_tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check release eligibility
        id: release
        run: |
          MANIFEST_VERSION=$(python3 -c "import json; print(json.load(open('custom_components/unraid_management_agent/manifest.json'))['version'])")
          VERSION="$MANIFEST_VERSION"
          CREATE_TAG=true
          PUBLISH=true
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            CREATE_TAG=false
          fi
          TAG="v${VERSION}"
          if [ "$CREATE_TAG" = true ]; then
            VER_RE=$(printf '%s' "$VERSION" | sed 's/\./\\./g')
            NOTES=$(awk -v ver="$VER_RE" '
              $0 ~ "^## \\[" ver "\\]" {in_section=1; next}
              in_section && $0 ~ /^## \[/ {exit}
              in_section {print}
            ' CHANGELOG.md)
            if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
              PUBLISH=false
              echo "Tag $TAG not created: CHANGELOG.md has no non-empty [$VERSION] section. Add release notes together with the manifest bump." >> "$GITHUB_STEP_SUMMARY"
            fi
            REMOTE_TAG=$(git ls-remote --tags origin "refs/tags/$TAG")
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || [ -n "$REMOTE_TAG" ]; then
              PUBLISH=false
              echo "Tag $TAG already exists. No new release created." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          PRERELEASE=false
          if [[ "$VERSION" =~ (alpha|beta|rc) ]]; then PRERELEASE=true; fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "prerelease=$PRERELEASE"
            echo "publish=$PUBLISH"
            echo "create_tag=$CREATE_TAG"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Set up uv
        if: steps.release.outputs.publish == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.12.22

      - name: Build release ZIP
        if: steps.release.outputs.publish == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          uv python install 3.14.2
          uv run --no-project --python 3.14.2 script/build-release.py --tag "$TAG"

      - name: Attest release ZIP
        if: steps.release.outputs.publish == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/unraid_management_agent.zip

      - name: Upload release assets
        if: steps.release.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            build/unraid_management_agent.zip
            build/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  # Maintainer prerequisite: enable release immutability in repository settings.
  # Checking that setting via REST requires Administration read permission,
  # which GITHUB_TOKEN cannot request. Published releases are never replaced.
  publish:
    name: Publish
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.build.outputs.tag }}
      COMMIT: ${{ needs.build.outputs.sha }}
      VERSION: ${{ needs.build.outputs.version }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
    steps:
      - name: Checkout built commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: build

      - name: Verify checksum and provenance
        working-directory: build
        run: |
          sha256sum -c SHA256SUMS
          gh attestation verify unraid_management_agent.zip --repo "$GH_REPO" \
            --signer-workflow "$GH_REPO/.github/workflows/release.yml" \
            --source-digest "$COMMIT"

      - name: Create tag at the built commit
        if: needs.build.outputs.create_tag == 'true'
        run: |
          REMOTE_TAG=$(git ls-remote --tags origin "refs/tags/$TAG")
          if [ -n "$REMOTE_TAG" ]; then
            # A failed publish can leave the annotated tag from this same build.
            # Peel it to its commit; lightweight tags already name the commit.
            TARGET=$(git ls-remote --tags origin "refs/tags/$TAG^{}" | cut -f1)
            if [ -z "$TARGET" ]; then TARGET=$(printf '%s\n' "$REMOTE_TAG" | cut -f1); fi
            if [ "$TARGET" = "$COMMIT" ]; then
              echo "Tag $TAG already points at $COMMIT; reusing it."
              exit 0
            fi
            echo "::error::Tag $TAG points at $TARGET, not $COMMIT; refusing to overwrite it."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$COMMIT" -m "Release $TAG"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "refs/tags/$TAG"

      - name: Remove a stale draft
        run: |
          # Listing succeeds before absence is inferred; API failures must stop publication.
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" > build/releases.json
          STATE=$(jq -r --arg tag "$TAG" '.[] | select(.tag_name == $tag) | .draft' build/releases.json)
          if [ "$STATE" = true ]; then
            gh release delete "$TAG" --yes
          elif [ -n "$STATE" ]; then
            echo "::error::A published release already exists for $TAG; refusing to replace it."
            exit 1
          fi

      - name: Generate release notes
        run: |
          VER_RE=$(printf '%s' "$VERSION" | sed 's/\./\\./g')
          awk -v ver="$VER_RE" '
            $0 ~ "^## \\[" ver "\\]" {in_section=1; next}
            in_section && $0 ~ /^## \[/ {exit}
            in_section {print}
          ' CHANGELOG.md > build/RELEASE_NOTES.md
          if [ -z "$(tr -d '[:space:]' < build/RELEASE_NOTES.md)" ]; then
            printf 'Unraid Management Agent %s\n\nSee CHANGELOG.md for changes.\n' "$VERSION" > build/RELEASE_NOTES.md
          fi
          PREVIOUS=$(git describe --tags --abbrev=0 "$COMMIT^" 2>/dev/null || true)
          {
            echo
            if [ -n "$PREVIOUS" ]; then
              echo "[Full changelog](https://github.com/$GH_REPO/compare/$PREVIOUS...$TAG)"
            else
              echo "[Full changelog](https://github.com/$GH_REPO/commits/$TAG)"
            fi
            echo
            echo '### Manual installation'
            # shellcheck disable=SC2016
            echo 'Extract `unraid_management_agent.zip` into `config/custom_components/unraid_management_agent/` and restart Home Assistant.'
            echo
            echo '### Verify the download'
            echo 'Download the ZIP and SHA256SUMS from this release into the same directory.'
            # shellcheck disable=SC2016
            echo '```bash'
            echo 'sha256sum -c SHA256SUMS'
            echo "gh attestation verify unraid_management_agent.zip --repo $GH_REPO --signer-workflow $GH_REPO/.github/workflows/release.yml"
            echo "gh release verify-asset $TAG unraid_management_agent.zip --repo $GH_REPO"
            echo '```'
            echo
            echo 'SHA256:'
            echo '```text'
            cat build/SHA256SUMS
            echo '```'
          } >> build/RELEASE_NOTES.md

      - name: Create draft release with assets
        run: |
          PRE_FLAG=()
          if [ "$PRERELEASE" = true ]; then PRE_FLAG=(--prerelease); fi
          gh release create "$TAG" build/unraid_management_agent.zip build/SHA256SUMS CHANGELOG.md \
            --draft --verify-tag --title "$TAG" --notes-file build/RELEASE_NOTES.md "${PRE_FLAG[@]}"

      - name: Publish release
        run: gh release edit "$TAG" --draft=false

      - name: Verify immutable release and assets
        run: |
          # Release attestations can become available shortly after publication.
          for attempt in $(seq 1 12); do
            if gh release verify "$TAG"; then break; fi
            if [ "$attempt" -eq 12 ]; then
              echo '::error::Release verification failed. Enable Settings → General → Releases → Enable release immutability before releasing.'
              exit 1
            fi
            sleep 5
          done
          gh release verify-asset "$TAG" build/unraid_management_agent.zip
          gh release verify-asset "$TAG" build/SHA256SUMS

      - name: Release summary
        run: |
          {
            echo "## Released $TAG"
            # shellcheck disable=SC2016
            echo 'Asset: `unraid_management_agent.zip`'
            echo "Commit: $COMMIT"
            echo "Prerelease: $PRERELEASE"
            echo "Release: https://github.com/$GH_REPO/releases/tag/$TAG"
            echo '```text'
            cat build/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
